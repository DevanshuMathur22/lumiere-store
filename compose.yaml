services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: lumiere_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - lumiere_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumiere -d lumiere_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lumiere_dev_data:
